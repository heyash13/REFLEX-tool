[project]
name = "re2-fuzzer"
version = "0.1.0"
description = "Closed-Loop Interpretability-Guided Fuzzing for LLM Refusal Mechanisms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pytest>=8.0.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
